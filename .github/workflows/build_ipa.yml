name: Build iOS IPA

on:
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮触发构建

jobs:
  build:
    runs-on: macos-15 # 使用 GitHub 免费提供的 macOS 云虚拟机

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Xcode Project
        run: |
          python3 ios-app/scripts/generate_xcode_project.py

      - name: Build App for iOS (Unsigned)
        run: |
          cd ios-app
          xcodebuild clean build \
            -project PhoneAgent.xcodeproj \
            -scheme PhoneAgent \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          cd ios-app
          mkdir -p Payload
          cp -r build/Release-iphoneos/PhoneAgent.app Payload/
          zip -r PhoneAgent.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneAgent-Unsigned-IPA
          path: ios-app/PhoneAgent.ipa
